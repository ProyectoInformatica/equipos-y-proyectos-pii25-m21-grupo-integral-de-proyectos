version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: smart_residencial_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smart_residencial
    ports:
      - "3306:3306"
    volumes:
      - "./Script-Smart Residencial.sql:/docker-entrypoint-initdb.d/init.sql"
      # Se monta con prefijo "zz_" para que se ejecute DESPUÉS del script base
      # (MySQL corre los scripts de init en orden alfabético) y así la tabla
      # Tipos ya exista cuando el script del pulsómetro la referencia.
      - "./Script-Pulsometro.sql:/docker-entrypoint-initdb.d/zz_pulsometro.sql"
    restart: unless-stopped
